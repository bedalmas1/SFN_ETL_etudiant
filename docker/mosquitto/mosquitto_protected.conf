# Laboratoire local uniquement. Le port Docker est lié à 127.0.0.1.
# Configuration pédagogique "broker protégé" de la séquence 7: authentification
# obligatoire et permissions par utilisateur, à comparer à mosquitto.conf
# (accès anonyme) utilisé par les séquences précédentes.
listener 1884 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.conf
persistence false
log_type warning
log_type notice
